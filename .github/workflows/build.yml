name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/telecom-private-socks
  pull_request:
    branches:
      - codex/telecom-private-socks

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV


    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - name: Install gomobile
      run: |
        mobile_version=$(cd AndroidLibXrayLite && go list -m -f '{{.Version}}' golang.org/x/mobile)
        go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
        go install "golang.org/x/mobile/cmd/gobind@$mobile_version"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Build patched libv2ray
      run: bash build-libv2ray.sh

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run all unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest :app:testFdroidDebugUnitTest :app:testTelecomDebugUnitTest

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:assemblePlaystoreDebug :app:assembleFdroidDebug :app:assembleTelecomDebug
        ./gradlew :app:lintPlaystoreDebug :app:lintFdroidDebug :app:lintTelecomDebug
        for variant in playstore fdroid telecom; do
          python3 ../scripts/check_native_packaging.py "app/build/outputs/apk/$variant/debug"
        done
    
    - name: Upload telecom arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: telecom-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/telecom/debug/*arm64-v8a*.apk
